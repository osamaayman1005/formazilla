name: Build APK

# Every push to main builds a release APK and publishes it under Releases.
# Download it on your phone from: Releases -> latest -> formazilla.apk

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated, not committed, so the repo stays small
      # and always matches the installed Flutter version.
      - name: Generate Android project
        run: |
          flutter create . --project-name formazilla --org app.formazilla --platforms android
          sed -i 's/android:label="formazilla"/android:label="Formazilla"/' android/app/src/main/AndroidManifest.xml
          # App icon (legacy + adaptive), generated from docs/logo.png
          cp -r ci/android-res/. android/app/src/main/res/

      # Same key every build, so new APKs install over old ones and keep your data.
      # The generated Gradle file signs release with the machine's debug key,
      # which is random per runner, so point release at the repo's key directly.
      - name: Use stable signing key
        run: |
          cat >> android/app/build.gradle.kts <<'EOF'

          android {
              signingConfigs {
                  create("formazilla") {
                      storeFile = rootProject.file("../ci/signing.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
              buildTypes {
                  getByName("release") { signingConfig = signingConfigs.getByName("formazilla") }
              }
          }
          EOF

      - name: Get packages
        run: flutter pub get 2>&1 | tee -a build.log

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log

      - name: Test
        run: flutter test 2>&1 | tee -a build.log

      - name: Build APK
        run: |
          # One small APK per phone chip instead of one big APK with all of them.
          # formazilla.apk = arm64 (almost every phone from the last ~8 years).
          # Build number = run number, so each APK is a newer version than the last.
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }} 2>&1 | tee -a build.log
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk formazilla.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk formazilla-older-phones.apk

      # Never publish an APK that can't update the installed app (that would
      # force an uninstall, which wipes the phone's workout data).
      - name: Check signing key
        run: |
          expected=$(keytool -list -keystore ci/signing.keystore -storepass android | grep -o 'SHA-256): .*' | cut -d' ' -f2 | tr -d ':' | tr 'A-F' 'a-f')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in formazilla.apk formazilla-older-phones.apk; do
            actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | awk '{print $NF}')
            echo "$apk: $actual"
            if [ "$actual" != "$expected" ]; then
              echo "Wrong signing key on $apk (expected $expected)" | tee -a build.log
              exit 1
            fi
          done

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Formazilla build ${{ github.run_number }}
          body: |
            Install: download formazilla.apk on your phone and open it.
            Very old phone and it won't install? Use formazilla-older-phones.apk.
            Commit: ${{ github.sha }}
          files: |
            formazilla.apk
            formazilla-older-phones.apk
          make_latest: true

      # Makes failures readable without signing in: the log lands in an issue.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          {
            echo "Build ${{ github.run_number }} failed on ${{ github.sha }}."
            echo
            echo '```'
            grep -nE "error|Error|ERROR|FAILED|Exception|warning •|info •" build.log | tail -n 150
            echo '---- last 80 lines ----'
            tail -n 80 build.log
            echo '```'
          } > report.md
          gh issue create --title "Build ${{ github.run_number }} failed" --body-file report.md
