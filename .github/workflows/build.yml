name: Build APK

# Every push to main builds a release APK and publishes it under Releases.
# Download it on your phone from: Releases -> latest -> formazilla.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The android/ folder is generated, not committed, so the repo stays small
      # and always matches the installed Flutter version.
      - name: Generate Android project
        run: |
          flutter create . --project-name formazilla --org app.formazilla --platforms android
          sed -i 's/android:label="formazilla"/android:label="Formazilla"/' android/app/src/main/AndroidManifest.xml

      # Same key every build, so new APKs install over old ones and keep your data.
      - name: Use stable signing key
        run: |
          mkdir -p ~/.android
          cp ci/signing.keystore ~/.android/debug.keystore

      - name: Get packages
        run: flutter pub get 2>&1 | tee -a build.log

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a build.log

      - name: Test
        run: flutter test 2>&1 | tee -a build.log

      - name: Build APK
        run: |
          flutter build apk --release 2>&1 | tee -a build.log
          cp build/app/outputs/flutter-apk/app-release.apk formazilla.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Formazilla build ${{ github.run_number }}
          body: |
            Install: download formazilla.apk on your phone and open it.
            Commit: ${{ github.sha }}
          files: formazilla.apk
          make_latest: true

      # Makes failures readable without signing in: the log lands in an issue.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch build.log
          {
            echo "Build ${{ github.run_number }} failed on ${{ github.sha }}."
            echo
            echo '```'
            grep -nE "error|Error|ERROR|FAILED|Exception|warning •|info •" build.log | tail -n 150
            echo '---- last 80 lines ----'
            tail -n 80 build.log
            echo '```'
          } > report.md
          gh issue create --title "Build ${{ github.run_number }} failed" --body-file report.md
