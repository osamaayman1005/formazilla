name: formazilla
description: Offline gym weight logger with PPL rotas and automatic PRs.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.4
  share_plus: ^11.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/mascot.png
  # Archivo (SIL Open Font License, assets/fonts/OFL.txt), bundled so it works offline.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
    - family: ArchivoCondensed
      fonts:
        - asset: assets/fonts/ArchivoCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/ArchivoCondensed-ExtraBold.ttf
          weight: 800
